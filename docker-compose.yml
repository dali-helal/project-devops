services:
  mongo:
    image: mongo:latest
    container_name: mern-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mern-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server
  
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mern-server
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/devops_db
    depends_on:
      - mongo
      
volumes:
  mongo-data:
