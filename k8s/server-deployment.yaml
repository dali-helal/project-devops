apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-server
spec:
  selector:
    matchLabels:
      app: mern-server
  replicas: 1
  template:
    metadata:
      labels:
        app: mern-server
    spec:
      containers:
        - name: mern-server
          image: dali917/mern-server:latest
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_URI
              value: mongodb://mongo:27017/mernapp
