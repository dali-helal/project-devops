apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-client
  namespace: mern-app
  labels:
    app: mern-client
spec:
  replicas: {{ .Values.client.replicas }}
  selector:
    matchLabels:
      app: mern-client
  template:
    metadata:
      labels:
        app: mern-client
    spec:
      containers:
      - name: client
        image: "{{ .Values.client.image }}:{{ .Values.client.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.client.port }}